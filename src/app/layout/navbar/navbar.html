<header class="navbar">
  <div class="navbar__inner">
    <a class="navbar__brand" href="#hero" [attr.aria-label]="'NAVBAR.HOME' | translate" (click)="closeMenu()">
      <span class="navbar__brand-mark">END</span>
      <span class="navbar__brand-name">Ezequiel Nicolas Di Leo</span>
    </a>

    <button
      class="navbar__toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-navigation"
      [attr.aria-label]="'NAVBAR.MENU' | translate"
      (click)="toggleMenu()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        @if (menuOpen()) {
          <path d="M6 6l12 12M18 6L6 18"/>
        } @else {
          <path d="M4 7h16M4 12h16M4 17h16"/>
        }
      </svg>
    </button>

    <nav
      id="primary-navigation"
      class="navbar__nav"
      [class.navbar__nav--open]="menuOpen()"
      [attr.aria-label]="'NAVBAR.NAVIGATION' | translate"
    >
      @for (item of items; track item.id) {
        <a
          class="navbar__link"
          [class.navbar__link--active]="activeSection() === item.id"
          [href]="'#' + item.id"
          (click)="closeMenu()"
        >
          {{ item.labelKey | translate }}
        </a>
      }

      <a
        class="navbar__cv"
        href="/CV-DiLeo-ES.pdf"
        download="CV-DiLeo-ES.pdf"
        [attr.aria-label]="'NAVBAR.DOWNLOAD_CV' | translate"
      >
        {{ 'NAVBAR.DOWNLOAD_CV' | translate }}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 3v12"/>
          <path d="M7 10l5 5 5-5"/>
          <path d="M5 21h14"/>
        </svg>
      </a>

      <div class="navbar__preferences" [attr.aria-label]="'NAVBAR.PREFERENCES' | translate">
        <button
          class="navbar__icon-button"
          type="button"
          [attr.aria-label]="theme() === 'dark' ? ('NAVBAR.LIGHT_THEME' | translate) : ('NAVBAR.DARK_THEME' | translate)"
          (click)="toggleTheme()"
        >
          @if (theme() === 'dark') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
            </svg>
          }
        </button>

        <button
          class="navbar__icon-button navbar__language"
          type="button"
          [attr.aria-label]="language.currentLang() === 'es' ? ('NAVBAR.ENGLISH' | translate) : ('NAVBAR.SPANISH' | translate)"
          (click)="toggleLanguage(); closeMenu()"
        >
          {{ language.currentLang() === 'es' ? 'ES' : 'EN' }}
        </button>
      </div>
    </nav>
  </div>
</header>
