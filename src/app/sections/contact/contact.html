<section id="contact" class="section contact" aria-labelledby="contact-title">
  <div class="container">
    <div class="contact__panel">
      <div>
        <span class="section-kicker">Contacto directo</span>
        <h2 id="contact-title">¿Conversamos sobre un rol o proyecto?</h2>
        <p>
          Estoy disponible para desafíos Full-Stack y Frontend donde el código,
          la arquitectura y el impacto de producto sean parte central del trabajo.
        </p>
      </div>

      <div class="contact__actions">
        <button
          class="contact__copy"
          type="button"
          [class.contact__copy--copied]="copied()"
          [attr.aria-label]="copied() ? 'Email copiado al portapapeles' : 'Copiar email al portapapeles'"
          (click)="copyEmail()"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            @if (copied()) {
              <path d="M5 12l4 4L19 6"/>
            } @else {
              <rect x="8" y="8" width="11" height="11" rx="2"/>
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
            }
          </svg>
          {{ copied() ? '¡Email copiado!' : 'Copiar email' }}
        </button>

        <div class="contact__links" aria-label="Enlaces profesionales">
          <a
            href="https://www.linkedin.com/in/ezequiel-di-leo/"
            target="_blank"
            rel="noopener noreferrer"
          >
            LinkedIn
          </a>
          <a
            href="https://github.com/ezequielDiLeo"
            target="_blank"
            rel="noopener noreferrer"
          >
            GitHub
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container footer__inner">
    <p>© 2026 Ezequiel Di Leo</p>
    <p>Full-Stack · Frontend · Angular</p>
  </div>
</footer>
